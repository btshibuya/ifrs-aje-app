<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IFRS AJE</title>
    <script>
      // 選んだ配色を、画面を描く前に当てる（読み込み時のちらつきを防ぐ）
      try {
        var c = localStorage.getItem('colorTheme')
        if (c && c !== 'word') document.documentElement.setAttribute('data-color', c)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
